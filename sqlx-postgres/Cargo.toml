[package]
name = "sqlx-postgres"
documentation = "https://docs.rs/sqlx"
description = "PostgreSQL driver implementation for SQLx. Not for direct use; see the `sqlx` crate for details."
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
any = ["sqlx-core/any"]
json = ["dep:serde", "dep:serde_json", "sqlx-core/json"]
migrate = ["sqlx-core/migrate", "dep:crc"]
offline = ["json", "sqlx-core/offline", "smallvec/serde"]

# Route the legacy `md5` password-authentication method (PasswordMessage's
# `Password::Md5` variant, see src/message/password.rs), SCRAM-SHA-256
# (the modern SASL method, see src/connection/sasl.rs), and the advisory-
# lock key derivation (HKDF-SHA256, see src/advisory_lock.rs) through
# system OpenSSL instead of the RustCrypto `md-5`/`hmac`/`sha2`/`hkdf`
# crates, for environments that require all cryptographic operations to
# go through a FIPS-certifiable OpenSSL build.
openssl = ["dep:openssl"]
# Explicit opt-in for the RustCrypto backend of the same code paths, not
# implied by anything else -- a consumer picks these when it wants that
# backend (as opposed to `openssl`, above).
md5-rust-crypto = ["dep:md-5"]
scram-rust-crypto = ["dep:hmac", "dep:sha2", "dep:subtle"]
advisory-lock-rust-crypto = ["dep:hkdf", "dep:sha2"]

# Type Integration features
bigdecimal = ["dep:bigdecimal", "dep:num-bigint", "sqlx-core/bigdecimal"]
bit-vec = ["dep:bit-vec", "sqlx-core/bit-vec"]
chrono = ["dep:chrono", "sqlx-core/chrono"]
ipnet = ["dep:ipnet", "sqlx-core/ipnet"]
ipnetwork = ["dep:ipnetwork", "sqlx-core/ipnetwork"]
mac_address = ["dep:mac_address", "sqlx-core/mac_address"]
rust_decimal = ["dep:rust_decimal", "rust_decimal/maths", "sqlx-core/rust_decimal"]
time = ["dep:time", "sqlx-core/time"]
uuid = ["dep:uuid", "sqlx-core/uuid"]

[dependencies]
# Futures crates
futures-channel = { version = "0.3.32", default-features = false, features = ["sink", "alloc", "std"] }
futures-core = { version = "0.3.32", default-features = false }
futures-util = { version = "0.3.32", default-features = false, features = ["alloc", "sink", "io"] }

# Cryptographic Primitives
crc = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }
openssl = { workspace = true, optional = true }
rand = { workspace = true }
sha2 = { workspace = true, optional = true }
# Constant-time comparison for SCRAM-SHA-256's server-signature check, on
# the RustCrypto backend only (the `openssl` backend uses
# `openssl::memcmp::eq` instead). Not a cryptographic primitive itself, so
# it isn't backend-selected.
subtle = { version = "2", optional = true }

# Type Integrations (versions inherited from `[workspace.dependencies]`)
bigdecimal = { workspace = true, optional = true }
bit-vec = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
ipnet = { workspace = true, optional = true }
ipnetwork = { workspace = true, optional = true }
mac_address = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
time = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

# Misc
atoi = "2.0"
base64.workspace = true
bitflags = { version = "2.4", default-features = false }
byteorder = { version = "1.4.3", default-features = false, features = ["std"] }
hex = "0.4.3"
itoa = "1.0.5"
log = "0.4.18"
memchr = { version = "2.5.0", default-features = false }
num-bigint = { version = "0.4.3", optional = true }
smallvec = { version = "1.13.1" }
stringprep = "0.1.2"
tracing = { version = "0.1.37", features = ["log"] }
whoami = { version = "2.0.2", default-features = false }

dotenvy.workspace = true
thiserror.workspace = true

serde = { version = "1.0.219", optional = true, features = ["derive"] }
serde_json = { version = "1.0.142", optional = true, features = ["raw_value"] }

[dependencies.sqlx-core]
workspace = true

[dev-dependencies.sqlx]
# FIXME: https://github.com/rust-lang/cargo/issues/15622
# workspace = true
path = ".."
features = ["postgres", "derive"]

[target.'cfg(target_os = "windows")'.dependencies]
etcetera = "0.11.0"

[dev-dependencies]
# Cross-checked against the SCRAM-SHA-256 (sasl.rs) and advisory-lock
# (advisory_lock.rs) OpenSSL implementations' own tests, regardless of
# which release feature set is active; never shipped (dev-only).
hmac.workspace = true
sha2.workspace = true
hkdf.workspace = true
futures-executor = "0.3"

[lints]
workspace = true
